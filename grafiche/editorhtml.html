<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generatore Post Blogger Auto - Sondaggi Bruno Rachiele</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #f4f6f9; color: #0f172a; padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 900px; width: 100%; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { font-size: 22px; margin-bottom: 20px; border-bottom: 2px solid #0f172a; padding-bottom: 10px; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .full-width { grid-column: span 2; }
        
        label { font-size: 12px; font-weight: 700; text-transform: uppercase; margin-bottom: 5px; display: block; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; }
        textarea { height: 70px; resize: vertical; }

        .output-box { position: relative; }
        pre { background: #0f172a; color: #f8fafc; padding: 15px; border-radius: 8px; font-size: 12px; overflow-x: auto; max-height: 350px; }
        .copy-btn { position: absolute; top: 10px; right: 10px; background: #10b981; color: white; border: none; padding: 8px 16px; border-radius: 4px; font-size: 12px; font-weight: 700; cursor: pointer; }
        .copy-btn:hover { background: #059669; }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 Generatore Post Blogger SEO - Automatizzato</h1>

    <div class="form-grid">
        <div>
            <label>Data Testo (Auto)</label>
            <input type="text" id="dataTesto" oninput="generateCode()">
        </div>
        <div>
            <label>Data ISO YYYY-MM-DD (Auto)</label>
            <input type="date" id="dataIso" oninput="updateAutoFields(); generateCode();">
        </div>

        <div class="full-width">
            <label>URL Post Finale (Auto-generato)</label>
            <input type="text" id="postUrl" oninput="generateCode()">
        </div>

        <div class="full-width">
            <label>URL Immagine Copertina (Fissa Predefinita)</label>
            <input type="text" id="imgCopertina" value="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEj3oENyRpBHtz3H7gnlGcoL1LByXkZnhJ778LMHidXlHODs-4Sa8C4syc4p8yAC8E36FRMIm77dyzUJ55qoKelRfylMpWrEtn9RjNpZxgl4xK4BSe4ycNARZL8_EVrqnyvvZqTCVUzZwUXNkQzwbDT-NvQ4hkRR0dbXpqqr-yujXa5kZjL65f-RSfAl7fk/s1600/NUOVE%20GRAFICHE%20SITO%20%282%29.png" oninput="generateCode()">
        </div>

        <div class="full-width">
            <label>URL Immagine Grafica Sondaggi (Inserisci il link del giorno)</label>
            <input type="text" id="imgSondaggi" placeholder="https://blogger.googleusercontent.com/img/.../GRAFICA_SONDAGGI.jpg" oninput="generateCode()">
        </div>

        <div class="full-width">
            <label>URL Immagine Preferenze Coalizioni (Inserisci il link del giorno)</label>
            <input type="text" id="imgCoalizioni" placeholder="https://blogger.googleusercontent.com/img/.../PREFERENZE_COALIZIONI.png" oninput="generateCode()">
        </div>

        <div class="full-width">
            <label>Testo Breve Articolo (Auto-generato)</label>
            <textarea id="testoArticolo" oninput="generateCode()"></textarea>
        </div>
    </div>

    <div class="output-box">
        <button class="copy-btn" onclick="copyCode()">📋 Copia Codice HTML</button>
        <pre><code id="codeOutput"></code></pre>
    </div>
</div>

<script>
const mesi = ["gennaio", "febbraio", "marzo", "aprile", "maggio", "giugno", "luglio", "agosto", "settembre", "ottobre", "novembre", "dicembre"];

function initDate() {
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const dd = String(today.getDate()).padStart(2, '0');
    
    document.getElementById('dataIso').value = `${yyyy}-${mm}-${dd}`;
    updateAutoFields();
}

function updateAutoFields() {
    const isoVal = document.getElementById('dataIso').value;
    if(!isoVal) return;

    const parts = isoVal.split('-');
    const year = parts[0];
    const monthIdx = parseInt(parts[1], 10) - 1;
    const day = parseInt(parts[2], 10);

    const monthName = mesi[monthIdx];
    const monthNumPadded = parts[1];

    // Data Testo
    const dataTestoStr = `${day} ${monthName} ${year}`;
    document.getElementById('dataTesto').value = dataTestoStr;

    // URL Canonico Auto
    const urlSlug = `sondaggio-politico-${day}-${monthName}-${year}-supermedia.html`;
    document.getElementById('postUrl').value = `https://www.brunorachiele.it/${year}/${monthNumPadded}/${urlSlug}`;

    // Testo Articolo Auto
    document.getElementById('testoArticolo').value = `Di seguito la supermedia dei sondaggi politici italiani aggiornata a ${dataTestoStr}, con il dettaglio sulle intenzioni di voto e i trend delle coalizioni.`;
}

function generateCode() {
    const dataTesto = document.getElementById('dataTesto').value;
    const dataIso = document.getElementById('dataIso').value;
    const postUrl = document.getElementById('postUrl').value;
    const imgCopertina = document.getElementById('imgCopertina').value;
    const imgSondaggi = document.getElementById('imgSondaggi').value || "URL_IMMAGINE_SONDAGGI_MANCANTE";
    const imgCoalizioni = document.getElementById('imgCoalizioni').value || "URL_IMMAGINE_COALIZIONI_MANCANTE";
    const testoArticolo = document.getElementById('testoArticolo').value;

    const htmlCode = `<!-- Schema.org Dati Strutturati per Google News -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "NewsArticle",
  "headline": "Sondaggio Politico ${dataTesto} – Supermedia Bruno Rachiele",
  "datePublished": "${dataIso}T08:00:00+02:00",
  "dateModified": "${dataIso}T08:00:00+02:00",
  "author": {
    "@type": "Person",
    "name": "Bruno Rachiele",
    "url": "https://www.brunorachiele.it/"
  },
  "publisher": {
    "@type": "Organization",
    "name": "Bruno Rachiele",
    "logo": {
      "@type": "ImageObject",
      "url": "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEiOeKLAFzNySkI5ahC_uZiv0Asne6shnjr1QndoMNmRBtkNdQfe59GGO3nY5nc5C4OCXNMXGXu1XtHm0X7gPqbvTgFjqszFGQrPD3G5R4c2MIJPiZCk5OX6dLbnYKeU1itEVo7OcJB9I0N-Wi9z9WP64l5_btoNMrZ111Ex8i-W9UcKwOJPv5uDnl6LwhA/s1600/2ed26cc2-38e4-4d67-a1c5-5e522b654c90%20%281%29.png"
    }
  },
  "image": [
    "${imgCopertina}"
  ],
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "${postUrl}"
  }
}
<\/script>

<!-- Contenuto dell'Articolo -->
<article itemscope="" itemtype="https://schema.org/NewsArticle">

  <h1 itemprop="headline">Sondaggio Politico ${dataTesto}</h1>

  <p style="color: #64748b; font-size: 0.9em;">
    Aggiornamento del <time datetime="${dataIso}" itemprop="datePublished">${dataTesto}</time>
  </p>

  <!-- Prima immagine: Eager per velocizzare LCP -->
  <div style="text-align: center; margin-top: 15px;">
    <img alt="Copertina Sondaggi Politici Bruno Rachiele" itemprop="image" loading="eager" src="${imgCopertina}" style="border-radius: 10px; height: auto; max-width: 100%;" />
  </div>

  <div style="text-align: center;">
    <img alt="Grafica del sondaggio politico aggiornato al ${dataTesto}" loading="lazy" src="${imgSondaggi}" style="border-radius: 8px; height: auto; margin-top: 20px; max-width: 100%;" />
  </div>

  <div style="text-align: center;">
    <img alt="Grafico preferenze coalizioni ${dataTesto}" loading="lazy" src="${imgCoalizioni}" style="border-radius: 8px; height: auto; margin-top: 20px; max-width: 100%;" />
  </div>

  <hr style="margin: 30px 0px; border: 0; border-top: 1px solid #e2e8f0;" />

  <!-- Testo dell'articolo -->
  <div itemprop="articleBody">
    <p>${testoArticolo}</p>
  </div>

  <p itemprop="author" style="color: #555555; font-size: 0.9em; margin-top: 15px;">
    Supermedia a cura di <strong>Bruno Rachiele</strong><br />
    Fonte dati ufficiale: 
    <a href="https://sondaggipoliticoelettorali.it" rel="noopener noreferrer" target="_blank">
      sondaggipoliticoelettorali.it
    </a>
  </p>

</article>`;

    document.getElementById('codeOutput').textContent = htmlCode;
}

function copyCode() {
    const codeText = document.getElementById('codeOutput').textContent;
    navigator.clipboard.writeText(codeText).then(() => {
        alert("Codice HTML copiato negli appunti!");
    });
}

// Inizializza al caricamento
initDate();
generateCode();
</script>

</body>
</html>
