<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generatore Grafica Sondaggi - Bruno Rachiele</title>
  <!-- Google Fonts: Titillium Web -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,300;0,400;0,600;0,700;0,900;1,400&display=swap" rel="stylesheet">
  <!-- Script per esportare in immagine PNG -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <script>
    // PROTEZIONE CON PASSWORD
    (function checkAuth() {
      const passwordCorretta = "191004";
      let inserita = prompt("Inserisci la password per accedere al generatore:");
      
      if (inserita !== passwordCorretta) {
        alert("Password errata! Accesso negato.");
        document.write("<h2 style='font-family:sans-serif; text-align:center; margin-top:50px; color:red;'>Accesso Negato. Ricarica la pagina per riprovare.</h2>");
        window.stop();
      }
    })();
  </script>

  <style>
    :root {
      /* Colore di sfondo blu identico alla grafica allegata */
      --bg-color: #0052b4;
      --border-color: rgba(255, 255, 255, 0.4);
      --text-color: #ffffff;
    }

    * {
      box-sizing: border-box;
      font-family: 'Titillium Web', sans-serif;
    }

    body {
      background-color: #0f172a;
      margin: 0;
      padding: 20px;
      color: #f8fafc;
    }

    .container {
      max-width: 1550px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 460px 1fr;
      gap: 30px;
    }

    @media (max-width: 1200px) {
      .container { grid-template-columns: 1fr; }
    }

    /* FORM STYLES */
    .form-card {
      background: #1e293b;
      padding: 22px;
      border-radius: 12px;
      border: 1px solid #334155;
      max-height: 92vh;
      overflow-y: auto;
    }

    .form-card h2 { margin-top: 0; color: #38bdf8; font-size: 20px; }
    .form-card h3 { color: #94a3b8; font-size: 15px; margin-top: 18px; }

    .paste-box-container {
      background: #0f172a;
      border: 1px dashed #38bdf8;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
    }
    .paste-box-container label {
      font-size: 13px;
      font-weight: 700;
      color: #38bdf8;
      display: block;
      margin-bottom: 6px;
    }
    .paste-box-container textarea {
      width: 100%;
      height: 100px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #fff;
      font-family: monospace;
      font-size: 12px;
      padding: 8px;
      resize: vertical;
      margin-bottom: 8px;
    }

    .form-group { margin-bottom: 12px; }
    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 4px;
      font-size: 13px;
      color: #cbd5e1;
    }

    .form-group input {
      width: 100%;
      padding: 8px 12px;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 6px;
      color: #fff;
      font-size: 14px;
    }

    .party-row {
      display: grid;
      grid-template-columns: 1fr 1.2fr 65px 65px 35px;
      gap: 5px;
      margin-bottom: 6px;
      align-items: center;
      background: #0f172a;
      padding: 6px;
      border-radius: 6px;
    }

    .party-row input {
      padding: 5px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 4px;
      color: #fff;
      font-size: 12px;
      width: 100%;
    }

    .btn {
      background: #10b981;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      width: 100%;
      font-size: 14px;
      transition: background 0.2s;
    }
    .btn:hover { background: #059669; }
    .btn-purple { background: #8b5cf6; }
    .btn-purple:hover { background: #7c3aed; }
    .btn-danger { background: #ef4444; padding: 4px 8px; font-size: 12px; }
    .btn-download { background: #0284c7; margin-top: 15px; width: 1000px; font-size: 16px; padding: 12px; }
    .btn-download:hover { background: #0369a1; }

    /* PREVIEW GRAPHIC BOX STYLES */
    .preview-card {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      overflow-x: auto;
    }

    .graphic-box {
      width: 1000px;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 30px 40px;
      position: relative;
      flex-shrink: 0;
      box-sizing: border-box;
    }

    .header-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
    }

    .title-section {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .flag {
      width: 14px;
      height: 42px;
      display: flex;
      flex-direction: column;
    }
    .flag-green { background: #009246; flex: 1; }
    .flag-white { background: #ffffff; flex: 1; }
    .flag-red { background: #ce2b37; flex: 1; }

    .title-text h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      line-height: 1;
    }

    .title-text span {
      font-weight: 300;
      opacity: 0.95;
    }

    .date-text {
      font-size: 18px;
      font-weight: 800;
      margin-top: 5px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .site-logo {
      height: 58px;
      width: auto;
      object-fit: contain;
    }

    /* TABLE LAYOUT RIGIDO E PERFETTO */
    .poll-table {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid var(--border-color);
    }

    .poll-table th, .poll-table td {
      border: 1px solid var(--border-color);
      padding: 7px 14px;
      text-align: center;
      vertical-align: middle;
    }

    .poll-table th {
      font-size: 13px;
      font-weight: 400;
      opacity: 0.95;
      line-height: 1.25;
      background: rgba(0, 0, 0, 0.08);
    }

    /* NOME DEL PARTITO NON IN GRASSETTO */
    .poll-table td.party-name {
      text-align: left;
      font-weight: 400; /* IMPOSIZIONATO NORMAL / REGULAR */
      text-transform: uppercase;
      font-size: 18px;
      letter-spacing: 0.5px;
      opacity: 0.95;
    }

    .party-cell {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .party-logo-img {
      width: 28px;
      height: 28px;
      object-fit: contain;
      border-radius: 50%;
      background: #ffffff;
      padding: 1px;
    }

    .poll-table td.val {
      font-weight: 800;
      font-size: 20px;
    }

    /* SIMBOLI TREND COLORATI */
    .symbol-up { color: #00ff2b; font-size: 16px; font-weight: 900; }
    .symbol-down { color: #ff1111; font-size: 16px; font-weight: 900; }
    .symbol-eq { color: #ffffff; font-size: 18px; font-weight: 800; }
  </style>
</head>
<body>

<div class="container">
  <!-- FORM INPUT -->
  <div class="form-card">
    <h2>Pannello Sondaggi</h2>
    
    <!-- BOX INCOLLA DA FOGLIO GOOGLE -->
    <div class="paste-box-container">
      <label for="pasteInput">📋 Incolla celle da Google Sheets / Excel</label>
      <textarea id="pasteInput" placeholder="Seleziona le celle nel foglio Google, copiale (Ctrl+C) e incollale qui (Ctrl+V)..."></textarea>
      <button class="btn btn-purple" onclick="importFromSpreadsheet()">📋 Importa Dati e Aggiorna</button>
    </div>

    <div class="form-group">
      <label>Data Corrente (es. 31 OTTOBRE 2026)</label>
      <input type="text" id="input-date" value="31 OTTOBRE 2026" oninput="updateGraphic()">
    </div>
    <div class="form-group">
      <label>Data Precedente per Trend (es. 17/10/2026)</label>
      <input type="text" id="input-prev-date" value="17/10/2026" oninput="updateGraphic()">
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 15px; margin-bottom: 8px;">
      <h3 style="margin:0;">Partiti inseriti</h3>
      <button class="btn" style="width:auto; padding:4px 10px; font-size:12px;" onclick="addPartyRow()">➕ Aggiungi</button>
    </div>

    <div id="parties-list"></div>

    <button class="btn" style="margin-top:15px;" onclick="updateGraphic()">Aggiorna Anteprima</button>
  </div>

  <!-- ANTEPRIMA GRAFICA -->
  <div class="preview-card">
    <div id="capture-area" class="graphic-box">
      <div class="header-box">
        <div class="title-section">
          <!-- Icona Urna Elettorale SVG -->
          <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2z"/><path d="m9 7 3-5 3 5"/><path d="M9 14h6"/></svg>
          <div class="flag">
            <div class="flag-green"></div>
            <div class="flag-white"></div>
            <div class="flag-red"></div>
          </div>
          <div class="title-text">
            <h1>INTENZIONI DI VOTO <span>- SUPERMEDIA</span></h1>
            <div class="date-text" id="display-date">31 OTTOBRE 2026</div>
          </div>
        </div>
        
        <!-- Logo Personale Bruno Rachiele -->
        <img src="https://static.brunorachiele.it/logo.png" id="site-logo-img" class="site-logo" alt="Bruno Rachiele Logo" crossorigin="anonymous">
      </div>

      <table class="poll-table">
        <thead>
          <tr>
            <th style="width: 48%;"></th>
            <th style="width: 14%;">
              <span style="color:#00ff2b;">▲</span> 
              <span style="color:#ff1111;">▼</span> 
              <span style="color:#ffffff;">=</span>
            </th>
            <th style="width: 19%;">stima<br><span id="display-header-date">31/10/2026</span></th>
            <th style="width: 19%;">Trend rispetto<br>al <span id="display-header-prev-date">17/10/2026</span></th>
          </tr>
        </thead>
        <tbody id="table-body">
          <!-- Popolato via JS -->
        </tbody>
      </table>
    </div>

    <button class="btn btn-download" onclick="downloadImage()">Scarica Grafica PNG</button>
  </div>
</div>

<script>
  // Mappatura automatica per la cartella img/
  const LOGO_MAP = {
    "FRATELLI D'ITALIA": "../img/fdi.png",
    "FRATELLI D’ITALIA": "../img/fdi.png",
    "PARTITO DEMOCRATICO": "../img/pd.png",
    "MOVIMENTO 5 STELLE": "../img/m5s.png",
    "FORZA ITALIA": "../img/fi.png",
    "LEGA": "../img/lega.png",
    "ALLEANZA VERDI-SINISTRA": "../img/avs.png",
    "AVS": "../img/avs.png",
    "FUTURO NAZIONALE": "../img/fn.png",
    "AZIONE": "../img/azione.png",
    "ITALIA VIVA": "../img/iv.png",
    "+EUROPA": "../img/europa.png",
    ".+EUROPA": "../img/europa.png",
    "NOI MODERATI": "../img/nm.png"
  };

  let pollData = [
    { logo: "../img/fdi.png", party: "FRATELLI D'ITALIA", val: "28,65", trend: 0.90 },
    { logo: "../img/pd.png", party: "PARTITO DEMOCRATICO", val: "20,30", trend: -0.45 },
    { logo: "../img/m5s.png", party: "MOVIMENTO 5 STELLE", val: "11,90", trend: -0.80 },
    { logo: "../img/fi.png", party: "FORZA ITALIA", val: "7,45", trend: 0.15 },
    { logo: "../img/avs.png", party: "ALLEANZA VERDI-SINISTRA", val: "3,10", trend: 0.10 },
    { logo: "../img/lega.png", party: "LEGA", val: "2,35", trend: -0.05 },
    { logo: "../img/azione.png", party: "AZIONE", val: "1,00", trend: 0.00 }
  ];

  function renderForm() {
    const list = document.getElementById('parties-list');
    list.innerHTML = '';
    pollData.forEach((item, index) => {
      list.innerHTML += `
        <div class="party-row">
          <input type="text" value="${item.logo}" id="p-logo-${index}" placeholder="Logo" oninput="saveCurrentFormData()">
          <input type="text" value="${item.party}" id="p-name-${index}" placeholder="Partito" oninput="saveCurrentFormData()">
          <input type="text" value="${item.val}" id="p-val-${index}" placeholder="%" oninput="saveCurrentFormData()">
          <input type="number" step="0.01" value="${item.trend}" id="p-trend-${index}" placeholder="Trend" oninput="saveCurrentFormData()">
          <button class="btn btn-danger" onclick="removePartyRow(${index})" title="Elimina">🗑️</button>
        </div>
      `;
    });
  }

  function saveCurrentFormData() {
    pollData = [];
    const rows = document.querySelectorAll('.party-row');
    rows.forEach((row, i) => {
      const logo = document.getElementById(`p-logo-${i}`).value;
      const party = document.getElementById(`p-name-${i}`).value;
      const val = document.getElementById(`p-val-${i}`).value;
      const trend = parseFloat(document.getElementById(`p-trend-${i}`).value) || 0;
      pollData.push({ logo, party, val, trend });
    });
    updateGraphic();
  }

  function addPartyRow() {
    pollData.push({ logo: "", party: "NUOVO PARTITO", val: "0,00", trend: 0.00 });
    renderForm();
    updateGraphic();
  }

  function removePartyRow(index) {
    pollData.splice(index, 1);
    renderForm();
    updateGraphic();
  }

  // ALGORITMO INTELLIGENTE DI IMPORTAZIONE DA GOOGLE SHEETS
  function importFromSpreadsheet() {
    const rawText = document.getElementById('pasteInput').value.trim();
    if (!rawText) return;

    const lines = rawText.split('\n');
    let newPollData = [];

    lines.forEach(line => {
      // Pulisce le tabulazioni e gli spazi vuoti vuoti creati da Google Sheets
      const cols = line.split('\t').map(c => c.trim()).filter(c => c !== "");
      
      if (cols.length >= 2) {
        let rawName = cols[0];
        if (rawName.toUpperCase().includes("PARTITI") || rawName.toUpperCase().includes("NOME")) return;

        // Prende la prima colonna numerica per la Stima % e l'ultima colonna per il Trend
        let rawVal = cols[1].replace('.', ',');
        let rawTrend = cols[cols.length - 1] ? parseFloat(cols[cols.length - 1].replace(',', '.')) : 0;

        if (rawName) {
          let upperName = rawName.toUpperCase();
          let logoPath = LOGO_MAP[upperName] || "../img/" + upperName.toLowerCase().replace(/[^a-z0-9]/g, '') + ".png";

          newPollData.push({
            logo: logoPath,
            party: upperName,
            val: rawVal,
            trend: isNaN(rawTrend) ? 0 : rawTrend
          });
        }
      }
    });

    if (newPollData.length > 0) {
      pollData = newPollData;
      renderForm();
      updateGraphic();
      alert(`Importati con successo ${newPollData.length} partiti!`);
    } else {
      alert("Nessun dato valido trovato. Incolla le righe dal tuo foglio Google.");
    }
  }

  function updateGraphic() {
    const dateVal = document.getElementById('input-date').value;
    document.getElementById('display-date').innerText = dateVal;
    
    document.getElementById('display-header-date').innerText = dateVal.includes(' ') ? dateVal.split(' ')[0] + '/10/2026' : dateVal;
    document.getElementById('display-header-prev-date').innerText = document.getElementById('input-prev-date').value;

    const tbody = document.getElementById('table-body');
    tbody.innerHTML = '';

    pollData.forEach((item) => {
      let arrowHTML = '<span class="symbol-eq">=</span>';
      let trendVal = parseFloat(item.trend);
      let trendText = trendVal > 0 ? `${trendVal.toFixed(2).replace('.', ',')}` : trendVal.toFixed(2).replace('.', ',');

      if (trendVal > 0) {
        arrowHTML = '<span class="symbol-up">▲</span>';
      } else if (trendVal < 0) {
        arrowHTML = '<span class="symbol-down">▼</span>';
      } else {
        arrowHTML = '<span class="symbol-eq">=</span>';
      }

      const imgTag = item.logo ? `<img src="${item.logo}" class="party-logo-img" alt="" onerror="this.style.display='none'">` : '';

      tbody.innerHTML += `
        <tr>
          <td class="party-name">
            <div class="party-cell">
              ${imgTag}
              <span>${item.party}</span>
            </div>
          </td>
          <td>${arrowHTML}</td>
          <td class="val">${item.val}</td>
          <td class="val">${trendText}</td>
        </tr>
      `;
    });
  }

  function downloadImage() {
    const area = document.getElementById('capture-area');
    html2canvas(area, { 
      scale: 2.5,
      useCORS: true
    }).then(canvas => {
      const link = document.createElement('a');
      link.download = `supermedia-sondaggi-${document.getElementById('input-date').value.replace(/\s+/g, '_')}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  }

  // Inizializzazione
  renderForm();
  updateGraphic();
</script>

</body>
</html>
